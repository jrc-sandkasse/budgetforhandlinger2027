<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kommunale budgetforhandlinger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16233A;
    --ink-soft:#3D4C63;
    --bg:#EAEDE7;
    --surface:#FFFFFF;
    --line:#D7DAD1;
    --accent:#2C4A6E;
    --accent-soft:#E4EAF0;
    --status-none:#8B8F86;
    --status-none-bg:#EDEEE9;
    --status-forhandling:#B7791F;
    --status-forhandling-bg:#FBF0DC;
    --status-aftale:#2C6E8E;
    --status-aftale-bg:#E1EEF3;
    --status-vedtaget:#3F7A5C;
    --status-vedtaget-bg:#E4F0E9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 100% 0%, rgba(44,74,110,0.06), transparent 45%),
      var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2,h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    margin:0;
  }
  .app{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}

  header.top{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:24px;
    border-bottom:2px solid var(--ink);
    padding-bottom:18px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  header.top h1{font-size:32px;letter-spacing:-0.015em;}
  header.top p{margin:6px 0 0;color:var(--ink-soft);max-width:52ch;font-size:13.5px;}
  .budget-year{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--accent);
    background:var(--accent-soft);
    padding:5px 12px;
    border-radius:20px;
    white-space:nowrap;
    box-shadow:0 1px 2px rgba(22,35,58,0.06);
  }
  .last-updated-badge{
    font-size:11.5px;
    color:var(--ink-soft);
    white-space:nowrap;
  }

  .gap-hero{
    display:flex;
    align-items:center;
    gap:20px;
    background:linear-gradient(120deg, #4A1518 0%, #7A1F1F 55%, #A6371E 100%);
    color:#fff;
    border-radius:14px;
    padding:22px 26px;
    margin-bottom:20px;
    box-shadow:0 8px 24px rgba(122,31,31,0.35);
    flex-wrap:wrap;
  }
  .gap-hero-icon{font-size:36px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.25));}
  .gap-hero-main{flex:2;min-width:260px;}
  .gap-hero-num{font-family:'Fraunces', serif;font-size:52px;font-weight:600;line-height:1;letter-spacing:-0.01em;}
  .gap-hero-unit{font-size:20px;font-weight:500;opacity:0.85;}
  .gap-hero-label{font-size:13px;opacity:0.9;margin-top:6px;max-width:52ch;line-height:1.5;}
  .gap-hero-label strong{color:#FFD7B0;}
  .gap-hero-num-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .gap-hero-badge{
    font-size:11px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.04em;
    background:rgba(255,255,255,0.16);
    border:1px solid rgba(255,255,255,0.35);
    padding:3px 10px;
    border-radius:20px;
    opacity:0.9;
  }
  .gap-hero-breakdown-btn{
    margin-top:12px;
    background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.4);
    color:#fff;
    font-family:inherit;
    font-size:12.5px;
    font-weight:500;
    padding:7px 14px;
    border-radius:20px;
    cursor:pointer;
    transition:all 0.15s ease;
  }
  .gap-hero-breakdown-btn:hover{background:rgba(255,255,255,0.24);}

  .knife-hero{
    display:flex;
    align-items:center;
    gap:20px;
    background:linear-gradient(120deg, #14161A 0%, #1E1416 55%, #3A1418 100%);
    color:#fff;
    border-radius:14px;
    padding:22px 26px;
    margin-bottom:20px;
    box-shadow:0 8px 24px rgba(20,15,16,0.4);
    flex-wrap:wrap;
  }
  .knife-hero-icon{
    font-size:36px;
    line-height:1;
    position:relative;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,0.4));
  }
  .knife-hero .blood-drop{
    font-size:16px;
    position:absolute;
    bottom:-6px;
    right:-6px;
  }
  .knife-hero .gap-hero-label strong{color:#FF8A8A;}
  .knife-hero .gap-hero-badge{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.3);}
  .knife-hero .gap-hero-breakdown-btn{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.3);}
  .knife-hero .gap-hero-breakdown-btn:hover{background:rgba(255,255,255,0.2);}

  .breakdown-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .breakdown-row:last-child{border-bottom:none;}
  .breakdown-kommune{font-weight:600;font-size:14px;}
  .breakdown-note{font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.5;max-width:42ch;}
  .breakdown-amount{
    font-family:'Fraunces', serif;
    font-size:20px;
    font-weight:600;
    white-space:nowrap;
    text-align:right;
  }
  .breakdown-amount .unit{font-size:12px;font-weight:500;color:var(--ink-soft);}

  .news-bar{margin-bottom:22px;}
  .news-bar-label{font-size:11.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:8px;}
  .news-scroll{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding-bottom:4px;
    scrollbar-width:thin;
  }
  .news-scroll::-webkit-scrollbar{height:6px;}
  .news-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;}
  .news-card{
    flex:0 0 auto;
    width:230px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 13px;
    text-decoration:none;
    color:inherit;
    display:block;
    box-shadow:0 1px 2px rgba(22,35,58,0.04);
    transition:all 0.15s ease;
  }
  .news-card:hover{border-color:var(--accent);box-shadow:0 4px 10px rgba(22,35,58,0.1);transform:translateY(-1px);}
  .news-source{font-size:10.5px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:0.03em;}
  .news-title{font-size:12.5px;color:var(--ink);line-height:1.4;margin-top:4px;font-weight:500;}
  .news-date{font-size:11px;color:var(--ink-soft);margin-top:6px;}

  .stat-strip{
    display:flex;
    gap:0;
    border:1px solid var(--line);
    background:var(--surface);
    margin-bottom:20px;
    overflow:hidden;
    flex-wrap:wrap;
    border-radius:10px;
    box-shadow:0 1px 3px rgba(22,35,58,0.05);
  }
  .stat{
    flex:1;
    min-width:130px;
    padding:16px 18px;
    border-right:1px solid var(--line);
    transition:background 0.15s ease;
  }
  .stat:hover{background:#FAFAF7;}
  .stat:last-child{border-right:none;}
  .stat .num{font-family:'Fraunces', serif;font-size:28px;font-weight:600;line-height:1;}
  .stat .label{font-size:12px;color:var(--ink-soft);margin-top:4px;}

  .toolbar{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .toolbar input[type=text]{
    flex:1;
    min-width:180px;
    padding:8px 10px;
    border:1px solid var(--line);
    background:var(--surface);
    font-family:inherit;
    font-size:13.5px;
    border-radius:3px;
  }
  select{
    padding:7px 8px;
    border:1px solid var(--line);
    background:var(--surface);
    font-family:inherit;
    font-size:13px;
    border-radius:3px;
    color:var(--ink);
  }
  .chip-row{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    padding:6px 13px;
    border:1px solid var(--line);
    background:var(--surface);
    border-radius:20px;
    font-size:12.5px;
    cursor:pointer;
    color:var(--ink-soft);
    user-select:none;
    transition:all 0.12s ease;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent);}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .sort-chip{margin-left:auto;white-space:nowrap;}
  .section-title{
    font-size:14px;
    font-weight:600;
    color:var(--ink-soft);
    margin:0 0 8px;
    text-transform:none;
  }

  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(22,35,58,0.05);}
  thead th{
    text-align:left;
    font-size:11.5px;
    text-transform:none;
    color:var(--ink-soft);
    font-weight:500;
    padding:11px 12px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    white-space:nowrap;
    background:#FAFAF7;
  }
  thead th:hover{color:var(--ink);}
  tbody tr{border-bottom:1px solid var(--line);cursor:pointer;transition:background 0.12s ease;}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:var(--accent-soft);}
  tbody td{padding:11px 12px;vertical-align:middle;font-size:13.5px;}
  td.region{color:var(--ink-soft);font-size:12.5px;}
  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:4px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:500;
    white-space:nowrap;
  }
  .badge .dot{width:7px;height:7px;border-radius:50%;}
  .badge.ikke_startet{background:var(--status-none-bg);color:var(--status-none);}
  .badge.ikke_startet .dot{background:var(--status-none);}
  .badge.forhandling{background:var(--status-forhandling-bg);color:var(--status-forhandling);}
  .badge.forhandling .dot{background:var(--status-forhandling);}
  .badge.aftale_indgaaet{background:var(--status-aftale-bg);color:var(--status-aftale);}
  .badge.aftale_indgaaet .dot{background:var(--status-aftale);}
  .badge.vedtaget{background:var(--status-vedtaget-bg);color:var(--status-vedtaget);}
  .badge.vedtaget .dot{background:var(--status-vedtaget);}

  .empty-cell{color:#B7BAB1;}

  .soon{font-weight:600;color:var(--status-forhandling);}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(22,35,58,0.4);
    backdrop-filter:blur(2px);
    display:flex;align-items:flex-start;justify-content:center;
    padding:40px 16px;overflow-y:auto;z-index:50;
  }
  .modal{
    background:var(--surface);
    max-width:640px;width:100%;
    border:1px solid var(--line);
    border-radius:14px;
    padding:26px 28px 28px;
    box-shadow:0 12px 32px rgba(22,35,58,0.18);
  }
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
  .modal-head h2{font-size:23px;}
  .modal-head .region-tag{font-size:12.5px;color:var(--ink-soft);margin-top:5px;}
  .close-btn{
    background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);
    line-height:1;padding:4px;border-radius:6px;transition:all 0.12s ease;
  }
  .close-btn:hover{color:var(--ink);background:var(--accent-soft);}

  .proposal-box{
    margin-top:16px;
    background:linear-gradient(180deg, #FBF8F1, #F7F4EC);
    border:1px solid #E8DFC8;
    border-radius:10px;
    padding:13px 16px;
  }
  .proposal-box-head{display:flex;align-items:center;gap:10px;}
  .proposal-icon{font-size:18px;}
  .proposal-title{font-size:13px;font-weight:600;color:var(--ink);}
  .proposal-date{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  .proposal-link{margin-top:8px;font-size:13px;}
  .proposal-link a{color:var(--accent);text-decoration:none;}
  .proposal-link a:hover{text-decoration:underline;}
  .proposal-flag{margin-top:8px;font-size:12.5px;line-height:1.5;color:var(--ink-soft);background:rgba(255,255,255,0.6);border-radius:6px;padding:8px 10px;}
  .proposal-flag strong{color:var(--ink);}
  .brief-dates{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 24px;
    margin-top:18px;
    padding:14px 16px;
    background:#F7F7F3;
    border:1px solid var(--line);
  }
  .brief-row{display:flex;flex-direction:column;gap:2px;}
  .brief-label{font-size:11.5px;color:var(--ink-soft);}
  .brief-value{font-size:14px;font-family:'IBM Plex Mono', monospace;}
  .brief-section{margin-top:20px;}
  .brief-section h3{font-size:13px;font-weight:600;color:var(--ink-soft);margin:0 0 6px;font-family:'IBM Plex Sans', sans-serif;}
  .brief-section p{margin:0;font-size:14px;line-height:1.6;}
  .kilde-tag{
    font-size:10.5px;
    font-weight:500;
    color:var(--accent);
    background:var(--accent-soft);
    padding:2px 8px;
    border-radius:10px;
    margin-left:6px;
    vertical-align:middle;
    text-transform:none;
  }
  .skoen-tag{
    font-size:10.5px;
    font-weight:600;
    color:var(--status-forhandling);
    background:var(--status-forhandling-bg);
    padding:2px 8px;
    border-radius:10px;
    margin-left:6px;
    vertical-align:middle;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .gap-metric{
    margin-top:10px;
    background:#FCF6E8;
    border:1px solid #EFDFAF;
    border-radius:8px;
    padding:9px 12px;
    font-size:13px;
    line-height:1.5;
  }
  .gap-metric-note{font-size:12px;color:var(--ink-soft);}
  .close-btn-text{
    border:1px solid var(--line);background:var(--surface);border-radius:3px;
    cursor:pointer;font-size:13px;padding:8px 16px;color:var(--ink);font-family:inherit;
  }
  .close-btn-text:hover{border-color:var(--ink);}
  .modal-footer{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:22px;padding-top:16px;border-top:1px solid var(--line);
  }
  .updated-at{font-size:11.5px;color:#9BA098;}
  .doc-links a{color:var(--accent);text-decoration:none;font-size:13px;}
  .doc-links a:hover{text-decoration:underline;}
  .doc-count{font-size:12.5px;color:var(--ink-soft);}
  .forslag-badge{
    display:inline-flex;
    align-items:center;
    gap:3px;
    font-size:11px;
    font-weight:600;
    color:#8A5A16;
    background:#FBF0DC;
    border:1px solid #EAD1A0;
    padding:2px 8px;
    border-radius:20px;
    cursor:help;
    vertical-align:middle;
    white-space:nowrap;
  }
  .knife-badge{
    display:inline-flex;
    align-items:center;
    gap:3px;
    font-size:11px;
    font-weight:600;
    color:#8A2323;
    background:#FBE0DC;
    border:1px solid #EAB0A6;
    padding:2px 8px;
    border-radius:20px;
    cursor:help;
    vertical-align:middle;
    white-space:nowrap;
  }
  .money-badge{
    display:inline-flex;
    align-items:center;
    gap:3px;
    font-size:11px;
    font-weight:600;
    color:#1E6B4F;
    background:#DFF3E8;
    border:1px solid #A9DCC2;
    padding:2px 8px;
    border-radius:20px;
    cursor:help;
    vertical-align:middle;
    white-space:nowrap;
  }
  .legend-note{font-size:12px;color:var(--ink-soft);margin-bottom:12px;}

  footer.appfoot{margin-top:26px;font-size:12px;color:var(--ink-soft);}
  .loading{padding:60px;text-align:center;color:var(--ink-soft);}
</style>
</head>

<div id="root" class="app"><div class="loading">Indlæser…</div></div>

<script>

const STATUS_LABELS = {

};
const STATUS_ORDER = ["ikke_startet","forhandling","aftale_indgaaet","vedtaget"];

const STORAGE_KEY = "budgetforhandlinger-data-v1";

let NEWS_ITEMS = [

  {

let state = {}; // id -> record
let lastUpdated = "2026-08-31";
let filters = { region: "Alle", status: "Alle", search: "" };
let sortBy = "aktualitet"; // "aktualitet" eller et kolonnenavn
let sortDir = "asc";
let openId = null;
let breakdownOpen = false;
let besparelseOpen = false;

// Rangerer en kommune efter hvor "aktuel" den er lige nu:
// aftale indgået (landet, men ikke endeligt vedtaget) > vedtaget > forhandling i gang > nærmer sig forhandlingsstart > ukendt
function stageInfo(r){
  if(r.status==="aftale_indgaaet") return {rank:0, key:r.aftaleDato||"0000-00-00"};
  if(r.status==="vedtaget") return {rank:1, key:r.vedtagelsesDato||"0000-00-00"};
  if(r.status==="forhandling") return {rank:2, key:r.forventetAftaleDato||"9999-99-99"};
  if(r.status==="ikke_startet"){
    if(r.forventetForhandlingsStart) return {rank:3, key:r.forventetForhandlingsStart};
    return {rank:4, key:"9999-99-99"};
  }
  return {rank:5, key:"9999-99-99"};
}

function aktualitetCompare(a,b){
  const ia = stageInfo(getRecord(a.id)), ib = stageInfo(getRecord(b.id));
  if(ia.rank!==ib.rank) return ia.rank-ib.rank;
  if(ia.rank===0 || ia.rank===1){ // aftale indgået / vedtaget: nyeste dato øverst
    if(ia.key!==ib.key) return ia.key>ib.key?-1:1;
  } else {
    if(ia.key!==ib.key) return ia.key<ib.key?-1:1;
  }
  return a.navn.localeCompare(b.navn,'da');
}

function columnCompare(a,b){
  const ra = getRecord(a.id), rb = getRecord(b.id);
  let va, vb;
  if(sortBy==="navn"){ va=a.navn; vb=b.navn; }
  else if(sortBy==="region"){ va=a.region; vb=b.region; }
  else if(sortBy==="status"){ va=STATUS_ORDER.indexOf(ra.status); vb=STATUS_ORDER.indexOf(rb.status); }
  else { va = ra[sortBy]||"9999-99-99"; vb = rb[sortBy]||"9999-99-99"; }
  if(va<vb) return sortDir==="asc"?-1:1;
  if(va>vb) return sortDir==="asc"?1:-1;
  return a.navn.localeCompare(b.navn,'da');
}

function applySort(list){
  const sorted = [...list];
  sorted.sort(sortBy==="aktualitet" ? aktualitetCompare : columnCompare);
  return sorted;
}

    resumeBeskaeftigelse: "",
    // Penge tilført SPECIFIKT for at dæmme op for underskud/udgiftspres på socialområdet
    // (genopretning/håndtering af hullet) — IKKE nye indsatser eller udvidelser.
    socialGenopretningMio: null,
    socialGenopretningKilde: "", // "forlig" eller "budgetforslag"
    socialGenopretningNote: "",
    // Penge SPARET/SKÅRET specifikt på social- eller beskæftigelsesområdet (spareplaner sat i værk) —
    // modstykket til genopretning: her er pengene taget væk, ikke tilført.
    socialBesparelseMio: null,
    socialBesparelseKilde: "", // "forlig" eller "budgetforslag"
    socialBesparelseNote: "",
    sidstOpdateret: ""
  };
}

function getRecord(id){
  const raw = state[id] || emptyRecord();
  return { ...raw, status: computeEffectiveStatus(raw) };
}

// Beregner den reelle status ud fra dagens dato holdt op mod de kendte tidspunkter —
// ikke bare om en dato findes, men om vi faktisk er nået til den endnu.
function computeEffectiveStatus(r){
  // Bekræftede kendsgerninger (forlig landet / vedtaget) overskrives aldrig af datologik.
  if(r.status === "aftale_indgaaet" || r.status === "vedtaget") return r.status;

  if(r.status === "forhandling"){
    const today = new Date(); today.setHours(0,0,0,0);
    // Ingen kendt forhandlingsstart-dato → vi kan reelt ikke sige, at forhandlingerne er i gang.
    if(!r.forventetForhandlingsStart) return "ikke_startet";
    const start = new Date(r.forventetForhandlingsStart+"T00:00:00");
    if(today < start) return "ikke_startet";
    return "forhandling";
  }

  return r.status;
}

async function loadData(){
  // Hent den nyeste data fra data.json, hvis den findes ved siden af denne fil.
  // Fejler dette (fx hvis filen mangler, eller siden åbnes lokalt uden webserver),
  // falder vi automatisk tilbage til den indbyggede data herover.
  try{
    const resp = await fetch('./data.json', { cache: "no-store" });
    if(resp.ok){
      const json = await resp.json();
      if(json.SEED_DATA) SEED_DATA = json.SEED_DATA;
      if(json.NEWS_ITEMS) NEWS_ITEMS = json.NEWS_ITEMS;
      if(json.lastUpdated) lastUpdated = json.lastUpdated;
    }
  }catch(e){
    // Ingen data.json tilgængelig — bruger den indbyggede fallback-data i stedet.
  }

  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    state = res && res.value ? JSON.parse(res.value) : {};
  }catch(e){
    state = {};
  }

  let storedVersion = null;
  try{
    const vRes = await window.storage.get(SEED_VERSION_KEY, false);
    storedVersion = vRes ? vRes.value : null;
  }catch(e){ storedVersion = null; }

  let changed = false;
  if(storedVersion !== SEED_VERSION){
    // Ny research er tilgængelig — synkroniser SEED_DATA ind (overskriver kun de kommuner, vi selv researcher).
    Object.keys(SEED_DATA).forEach(id=>{
      state[id] = { ...emptyRecord(), ...SEED_DATA[id] };
    });
    changed = true;
  }
  if(changed){
    await persist();
    try{ await window.storage.set(SEED_VERSION_KEY, SEED_VERSION, false); }catch(e){}
  }
  render();
}

async function persist(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
  }catch(e){
    console.error("Kunne ikke gemme", e);
  }
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+"T00:00:00");
  const now = new Date();
  now.setHours(0,0,0,0);
  return Math.round((d-now)/86400000);
}

function fmtDate(dateStr){
  if(!dateStr) return "";
  const d = new Date(dateStr+"T00:00:00");
  return d.toLocaleDateString('da-DK', {day:'numeric', month:'short'});
}

function fmtDateLong(dateStr){
  if(!dateStr) return "";
  const d = new Date(dateStr+"T00:00:00");
  return d.toLocaleDateString('da-DK', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
}

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function computeGenopretning(){
  let total = 0;
  let kommunerMedTal = 0;
  let kommunerBehandlet = 0;
  KOMMUNER.forEach(k=>{
    const r = state[k.id];
    if(r){
      kommunerBehandlet++;
      if(typeof r.socialGenopretningMio === "number"){
        total += r.socialGenopretningMio;
        kommunerMedTal++;
      }
    }
  });
  return { total, kommunerMedTal, kommunerBehandlet };
}

function computeBesparelse(){
  let total = 0;
  let kommunerMedTal = 0;
  KOMMUNER.forEach(k=>{
    const r = state[k.id];
    if(r && typeof r.socialBesparelseMio === "number"){
      total += r.socialBesparelseMio;
      kommunerMedTal++;
    }
  });
  return { total, kommunerMedTal };
}

function computeStats(){
  const counts = {ikke_startet:0, forhandling:0, aftale_indgaaet:0, vedtaget:0};
  KOMMUNER.forEach(k=>{
    const r = getRecord(k.id);
    counts[r.status] = (counts[r.status]||0)+1;
  });
  return counts;
}

function getFiltered(){
  return KOMMUNER.filter(k=>{
    if(filters.region!=="Alle" && k.region!==filters.region) return false;
    const r = getRecord(k.id);
    if(filters.status!=="Alle" && r.status!==filters.status) return false;
    if(filters.search && !k.navn.toLowerCase().includes(filters.search.toLowerCase())) return false;
    return true;
  });
}

function getGroups(){
  const filtered = getFiltered();
  const top = applySort(filtered.filter(k=>TOP6_IDS.includes(k.id)));
  const rest = applySort(filtered.filter(k=>!TOP6_IDS.includes(k.id)));
  return {top, rest};
}

function setSort(col){
  if(sortBy===col){ sortDir = sortDir==="asc"?"desc":"asc"; }
  else { sortBy=col; sortDir="asc"; }
  render();
}

function isSoon(dateStr, days){
  const left = daysUntil(dateStr);
  return left !== null && left >= 0 && left <= days;
}

function renderRows(list){
  return list.map(k=>{
    const r = getRecord(k.id);
    const soon = r.status!=="vedtaget" && r.status!=="aftale_indgaaet" && isSoon(r.forventetAftaleDato, 14);
    const startSoon = isSoon(r.forventetForhandlingsStart, 14);
    return `
      <tr data-id="${k.id}">
        <td>${k.navn}${(r.budgetforslagDato || r.budgetforslagLink) ? ` <span class="forslag-badge" title="Budgetforslag/udkast foreligger">📄 Udkast</span>` : ''}${(typeof r.socialBesparelseMio === "number") ? ` <span class="knife-badge" title="Dokumenteret besparelse på social-/beskæftigelsesområdet">🔪 Besparelse</span>` : ''}${(typeof r.socialGenopretningMio === "number") ? ` <span class="money-badge" title="Dokumenteret tilførsel til socialområdet">💵 Tilførsel</span>` : ''}</td>
        <td class="region">${k.region}</td>
        <td><span class="badge ${r.status}"><span class="dot"></span>${STATUS_LABELS[r.status]}</span></td>
        <td class="${startSoon?'soon':(!r.forventetForhandlingsStart?'empty-cell':'')}">${r.forventetForhandlingsStart?fmtDate(r.forventetForhandlingsStart)+(r.forventetForhandlingsStartSkoen?' · skøn':(startSoon?' · snart':'')):'—'}</td>
        <td class="${soon?'soon':(!r.forventetAftaleDato?'empty-cell':'')}">${r.forventetAftaleDato?fmtDate(r.forventetAftaleDato)+(r.forventetAftaleDatoSkoen?' · skøn':(soon?' · snart':'')):'—'}</td>

        <td class="doc-count">${lastUpdated ? fmtDate(lastUpdated) : '—'}</td>
      </tr>
    `;
  }).join('');
}

          <div class="breakdown-row">
            <div>
              <div class="breakdown-kommune">${k.navn} <span class="kilde-tag">${r.socialGenopretningKilde === 'forlig' ? 'Kilde: forlig' : 'Kilde: budgetforslag'}</span></div>
              <div class="breakdown-note">${escapeHtml(r.socialGenopretningNote || '')}</div>
            </div>
            <div class="breakdown-amount">${r.socialGenopretningMio}<span class="unit"> mio. kr.</span></div>
          </div>
        `).join('') : `<p class="empty-cell">Ingen kommuner med et konkret tal endnu.</p>`}
      </div>

      <div class="modal-footer">
        <span class="updated-at">Tallet er foreløbigt og vokser i takt med, at flere kommuners forlig og budgetforslag gennemgås.</span>
        <button class="close-btn-text" id="closeBreakdown2">Luk</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelector('#closeBreakdown').addEventListener('click', ()=>{ breakdownOpen=false; renderBreakdown(); });
  overlay.querySelector('#closeBreakdown2').addEventListener('click', ()=>{ breakdownOpen=false; renderBreakdown(); });
  overlay.addEventListener('click', e=>{ if(e.target===overlay){ breakdownOpen=false; renderBreakdown(); } });
}

function renderBesparelseBreakdown(){
  let overlay = document.getElementById('besparelseOverlay');
  if(overlay) overlay.remove();
  if(!besparelseOpen) return;

  const rows = KOMMUNER
    .map(k=>({ k, r: state[k.id] }))
    .filter(x => x.r && typeof x.r.socialBesparelseMio === "number")
    .sort((a,b)=> b.r.socialBesparelseMio - a.r.socialBesparelseMio);

  const total = rows.reduce((s,x)=> s + x.r.socialBesparelseMio, 0);

  overlay = document.createElement('div');
  overlay.id = 'besparelseOverlay';
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <div>
          <h2>Hvad består tallet af?</h2>
          <div class="region-tag">${total.toLocaleString('da-DK')} mio. kr. fordelt på ${rows.length} kommune${rows.length===1?'':'r'} — foreløbigt, opdateres løbende</div>
        </div>
        <button class="close-btn" id="closeBesparelse">&times;</button>
      </div>

      <div style="margin-top:14px;">
        ${rows.length ? rows.map(({k,r})=>`
          <div class="breakdown-row">
            <div>
              <div class="breakdown-kommune">${k.navn} <span class="kilde-tag">${r.socialBesparelseKilde === 'forlig' ? 'Kilde: forlig' : 'Kilde: budgetforslag'}</span></div>
              <div class="breakdown-note">${escapeHtml(r.socialBesparelseNote || '')}</div>
            </div>
            <div class="breakdown-amount">${r.socialBesparelseMio}<span class="unit"> mio. kr.</span></div>
          </div>
        `).join('') : `<p class="empty-cell">Ingen kommuner med et konkret, dokumenteret spareplan-tal endnu.</p>`}
      </div>

      <div class="modal-footer">
        <span class="updated-at">Tallet er foreløbigt og vokser i takt med, at flere kommuners forlig og budgetforslag gennemgås.</span>
        <button class="close-btn-text" id="closeBesparelse2">Luk</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelector('#closeBesparelse').addEventListener('click', ()=>{ besparelseOpen=false; renderBesparelseBreakdown(); });
  overlay.querySelector('#closeBesparelse2').addEventListener('click', ()=>{ besparelseOpen=false; renderBesparelseBreakdown(); });
  overlay.addEventListener('click', e=>{ if(e.target===overlay){ besparelseOpen=false; renderBesparelseBreakdown(); } });
}

loadData();
</script>
</body>
</html>
